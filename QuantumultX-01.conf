# 
[general]
# 对指定的网址进行相应测试，以确认节点的可用性
server_check_url=http://cp.cloudflare.com/generate_204
# 资源解析器（用于处理订阅等）
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# 节点页面的信息展示（地理位置查询）
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js

# 下列表中内容将不经过 QuantumultX 的处理（直连）
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
#udp_whitelist=1-442, 444-65535
# dns_exclusion_list（不使用 QuantumultX DNS 查询的域名）
dns_exclusion_list=*.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
# > udp_drop_list 可直接屏蔽 STUN、QUIC 等协议的数据包
udp_drop_list = 443, STUN, QUIC

# 开启 ICMP 自动回复（提高连接稳定性）
icmp_auto_reply=true

[dns]
;prefer-doh3
;doh-server = https://223.5.5.5/dns-query, https://223.6.6.6/dns-query
# > QuantumultX开启IPV6方法，删去下面的「no-ipv6」，在「VPN」栏中，开启「兼容性增强」
#no-ipv6
# 禁用系统自带 DNS 解析
no-system
# 主要 DNS 服务器
server=223.5.5.5
server=119.29.29.29
server=8.8.8.8
# 针对特定域名使用指定的 DNS 服务器（国内 DNS）
server=/*.icloud.com/119.29.29.29
server=/*.icloud.com.cn/119.29.29.29
server=/*.tencent.com/119.29.29.29
server=/*.weixin.com/119.29.29.29


[policy]
## 策略组

# FINAL策略：如果以下策略均未被匹配到，则听从此策略
static=Final, Auto-HK, proxy, HK, TW, JP, KR, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
# 自动选择香港,台湾,日本最优节点
url-latency-benchmark=Auto-HK, server-tag-regex=香港|🇭🇰|HK|中港|沪港|Hong|Next, check-interval=1200, tolerance=50, alive-checking=false, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
url-latency-benchmark=Auto-TW, server-tag-regex=台|台湾|Taiwan|TW, check-interval=1200, tolerance=50, alive-checking=false, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png
url-latency-benchmark=Auto-JP, server-tag-regex=日本|东京|Tokyo|大阪|埼玉|🇯🇵|JP|Japan, check-interval=1200, tolerance=50, alive-checking=false, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
## 地区分组策略
# 香港策略组
static=HK, server-tag-regex=HK|香港|🇭🇰️|中港|沪港|Hong|Next, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/HK.png
# 台湾策略组
static=TW, server-tag-regex=台|台湾|Taiwan|TW, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TW.png
# 美国策略组
static=US, server-tag-regex=美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|California|芝加哥|🇺🇸|United States|US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/US.png
# 日本策略组
static=JP, server-tag-regex=日本|东京|Tokyo|大阪|埼玉|🇯🇵|JP|Japan, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/JP.png
# 新加坡策略组
static=SG, server-tag-regex=狮城|新加坡|Singapore|🇸🇬|SG, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SG.png

## 媒体/服务细分策略

# > Bilibili策略：国内直连，防止绕路或解锁失败
static=Bilibili, direct, HK, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili_4.png
# > GitHub策略：
static=GitHub, direct, HK, TW, JP, SG, US, Auto-JP, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/GitHub.png
# > Steam策略：游戏平台
static=Steam, HK, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png
# > YouTube策略：
static=YouTube, HK, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
# > Google策略：google,gemini
static=Google, HK, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
# > Twitter策略（X,grok)
static=Twitter, HK, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png
# > Telegram策略：
static=Telegram, HK, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
# > OpenAI策略：ChatGPT等
static=OpenAI, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
# > Apple策略：苹果
static=Apple, direct, HK, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
# > Microsoft策略：微软
static=Microsoft, direct, HK, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/OneDrive.png
# > Speedtest策略：测速
static=Speedtest, direct, proxy, HK, TW, JP, SG, US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png
# > Global策略:未匹配的国外流量
static=Global, HK, TW, JP, SG, US, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Europe_Map.png
# Mainland策略:国内访问
static=Mainland, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China_Map.png


